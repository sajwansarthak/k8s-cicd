apiVersion: apps/v1
kind: Deployment
metadata:
  name: k8s-cicd-demo
  labels:
    app: k8s-cicd-demo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: k8s-cicd-demo
  template:
    metadata:
      labels:
        app: k8s-cicd-demo
    spec:
      containers:
        - name: k8s-cicd-demo
          # The CI pipeline rewrites this line with the new commit SHA on every push
          image: sajwansarthak/k8s-cicd-demo:e0214e55617d62eac2039c003f11adbab69d46f3
          ports:
            - containerPort: 3000
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
